services:
  silo:
    container_name: ${COMPOSE_PROJECT_NAME:-project}-silo-container
    image: ${COMPOSE_PROJECT_NAME:-project}-silo
    build:
      context: .
      dockerfile: silo.Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    tty: true
    stdin_open: true
    stop_grace_period: 0s
    ports:
      - "3000:3000"
    environment:
      - UV_PROJECT_ENVIRONMENT=/silo-env/.venv
      - UV_CACHE_DIR=/silo-env/.cache/uv
    volumes:
      - .:/home/ubuntu/workspace
      - ~/.silo/agents:/home/ubuntu/.agents
      - ~/.silo/config/opencode:/home/ubuntu/.config/opencode
      - ~/.silo/local/share/opencode:/home/ubuntu/.local/share/opencode
      - silo-env:/silo-env
    command: >
      bash -c "sudo chown -R ubuntu:ubuntu /silo-env && bash"

volumes:
  silo-env:
